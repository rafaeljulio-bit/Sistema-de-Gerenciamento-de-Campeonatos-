{% extends 'base.html' %}

{% block title %}Excluir registro | Hat Trick{% endblock %}

{% block content %}

<div class="login-container">

    <div class="card account-card p-4">

        <h2 class="text-danger text-center mb-4">
            Excluir registro
        </h2>

        <p class="text-center">
            Tem certeza de que deseja excluir
            <strong>{{ registro }}</strong>?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button type="submit"
                    class="btn btn-danger w-100">
                Confirmar exclusão
            </button>

        </form>

        <a href="{% url 'listarCadastro' tipo %}"
           class="btn btn-outline-light mt-3">
            Cancelar
        </a>

    </div>

</div>

{% endblock %}
