{% extends 'base.html' %}

{% block title %}Criar conta | Hat Trick{% endblock %}

{% block content %}

<div class="login-container">

    <div class="card account-card p-4">

        <a href="{% url 'home' %}"
            class="btn-voltar"
            title="Voltar ao perfil"
            aria-label="Voltar ao perfil">
            &#8592;
        </a>

        <h2 class="text-green text-center mb-4">
            Criar conta
        </h2>

        <form method="POST" class="account-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-primary w-100">
                Cadastrar
            </button>

        </form>

        <p class="text-center mt-3">
            Já possui uma conta?

            <a class="text-green" href="{% url 'login' %}">
                Entrar
            </a>
        </p>

    </div>

</div>

{% endblock %}
