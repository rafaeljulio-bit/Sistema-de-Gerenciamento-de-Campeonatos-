{% extends 'base.html' %}
{% load static %}

{% block title %}Login | Hat Trick{% endblock %}

{% block content %}

<div class="login-container">

    <div class="card login-card p-4">

        <a href="{% url 'home' %}"
            class="btn-voltar"
            title="Voltar ao perfil"
            aria-label="Voltar ao perfil">
            &#8592;
        </a>

        <div class="text-center mb-4">

            <img src="{% static 'logo.jpg' %}"
                 alt="Logo Hat Trick"
                 class="login-logo">

            <h2 class="text-green mt-3">HAT TRICK</h2>

            <p>Acesse sua conta</p>

        </div>

        {% if form.errors %}
            <div class="alert alert-danger">
                Usuário ou senha inválidos.
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label">
                    Usuário
                </label>

                <input type="text"
                       name="username"
                       id="username"
                       class="form-control"
                       autocomplete="username"
                       required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Senha
                </label>

                <input type="password"
                       name="password"
                       id="password"
                       class="form-control"
                       autocomplete="current-password"
                       required>
            </div>

            <input type="hidden" name="next" value="{{ next }}">

            <button type="submit"
                    class="btn btn-primary w-100">
                Entrar
            </button>

        </form>

    </div>

</div>

{% endblock %}
