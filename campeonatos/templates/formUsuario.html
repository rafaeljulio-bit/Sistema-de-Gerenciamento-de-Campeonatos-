{% extends 'base.html' %}

{% block title %}{{ titulo }} | Hat Trick{% endblock %}

{% block content %}

<div class="login-container">

    <div class="card account-card p-4">

        <a href="{% url 'listarUsuarios' %}"
           class="btn-voltar"
           title="Voltar"
           aria-label="Voltar">

            &#8592;

        </a>

        <h2 class="text-green text-center mb-4 tituloCadastro">
            {{ titulo }}
        </h2>

        <form method="POST"
              class="account-form"
              onsubmit="this.querySelector('button[type=submit]').disabled = true;">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-primary w-100">

                Salvar

            </button>

        </form>

    </div>

</div>

{% endblock %}
